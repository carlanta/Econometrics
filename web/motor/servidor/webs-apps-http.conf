# Apps de las asignaturas: caché en el navegador solo para estilos, scripts, fuentes e imágenes (Shiny los sirve con la
# versión en la ruta, p. ej. bootstrap-5.3.8/…, así que no cambian sin cambiar de nombre). Las páginas, nunca.
# Se instala en /etc/nginx/conf.d/ con publicar.sh y lo usa /etc/nginx/snippets/webs-apps-proxy.conf.
map $uri $webs_apps_cache {
    ~*\.(css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|ico)$  "private, max-age=86400";
    default                                            "private, no-store";
}
