# Proxy hacia la VM de apps de una asignatura (Shiny Server). Se instala en /etc/nginx/snippets/ con publicar.sh
# y lo incluyen los bloques /apps/ y /profesor/apps/ de la plantilla de la web.
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;          # Shiny trabaja con websockets
proxy_set_header Connection $http_connection;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Authorization "";               # la clave de la web no viaja a la VM de apps
proxy_read_timeout 3600s;                         # una sesión de clase sin cortes
proxy_send_timeout 3600s;
proxy_buffering off;
# Rapidez al abrir: los ~900 KB de estilos y scripts de Shiny viajan comprimidos (~220 KB) y el navegador los guarda
# un día ($webs_apps_cache, en conf.d/webs-apps-http.conf); las páginas y los datos, nunca.
gzip on;
gzip_proxied any;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
proxy_hide_header Cache-Control;
proxy_hide_header Expires;
proxy_hide_header Last-Modified;
add_header Cache-Control $webs_apps_cache always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
