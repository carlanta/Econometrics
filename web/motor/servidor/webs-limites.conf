# Webs docentes · límite de peticiones por visitante, contra quien pruebe claves a ciegas.
# La IP real llega desde Nginx Proxy Manager (set_real_ip_from en conf.d/00-seguridad.conf).
# Se instala en /etc/nginx/conf.d/webs-limites.conf con web/motor/publicar.sh (motor webMotor)
limit_req_zone $binary_remote_addr zone=webs_por_ip:10m rate=10r/s;
limit_req_status 429;
